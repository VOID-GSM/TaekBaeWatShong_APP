packages:
  - 'apps/*'
  - 'packages/*'

# React Native / Metro 는 심볼릭 링크 기반 해석에서 중복 인스턴스 문제가 생기기 쉬우므로
# Expo 공식 가이드대로 평탄한 node_modules 를 쓴다.
nodeLinker: hoisted

# Expo / RN 패키지들이 peer dependency 를 느슨하게 선언하는 경우가 많다.
strictPeerDependencies: false
autoInstallPeers: true

# 네이티브 바인딩이 필요한 패키지만 설치 스크립트를 허용한다.
allowBuilds:
  '@parcel/watcher': true
  dtrace-provider: false
  protobufjs: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@tanstack/query-core@5.103.2'
  - '@tanstack/react-query@5.103.2'
  - '@expo/cli@58.1.15'
  - '@expo/config@58.0.8'
  - '@expo/local-build-cache-provider@58.0.8'
  - '@expo/metro-config@58.0.17'
  - '@expo/prebuild-config@58.0.16'
  - '@expo/router-server@58.0.17'
  - babel-preset-expo@58.0.20
  - expo-file-system@58.0.11
  - expo-font@58.0.10
  - expo-modules-autolinking@58.0.15
  - expo-modules-cli@0.3.2
  - expo-modules-core@58.0.26
  - expo-modules-jsi@58.0.19
  - expo-server@58.0.6
  - expo@58.0.19
  - expo-dev-client@58.0.15
  - expo-dev-launcher@58.0.15
  - expo-glass-effect@58.0.5
  - expo-router@58.0.26
