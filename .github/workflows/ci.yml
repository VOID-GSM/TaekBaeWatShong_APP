name: CI

# develop·main 푸시는 deploy.yml 이 이 워크플로우를 불러 검사한 뒤 배포한다.
on:
  pull_request:
  workflow_call:

# 같은 PR·브랜치에 새 커밋이 오면 이전 실행은 취소한다.
# 불려 올 때 github.workflow 는 부른 쪽 이름이라 쓰지 않는다(같은 그룹이면 서로 막힌다).
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      # turbo 로컬 캐시. 바뀌지 않은 패키지는 이전 결과를 재사용한다.
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
