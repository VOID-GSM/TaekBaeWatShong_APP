name: Setup
description: pnpm·Node 를 준비하고 의존성을 설치한다(pnpm store 캐시 포함).

runs:
  using: composite
  steps:
    # 버전은 package.json 의 packageManager 를 따른다.
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash
